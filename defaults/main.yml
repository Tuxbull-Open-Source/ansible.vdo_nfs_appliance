---
# Optional Cockpit storage dashboard.
installCockpit: true

# NFS export clients and options. Use approved network restrictions in production.
nfsWriteIps: 127.0.0.1
nfsWriteOpts: '(rw,sync,no_wdelay,no_root_squash,insecure)'
nfsReadIps: 127.0.0.2
nfsReadOpts: '(ro)'

# Destructive VDO backing device: bare non-root disk name only, for example vdb.
vdoPhyDev: vdb
vdoDev: "store-{{ vdoPhyDev }}"
vdoVolumeGroup: "vg-{{ vdoPhyDev }}"
# Percent of the volume group allocated to the VDO physical pool.
vdoPhysicalSize: '90%VG'
vdoMountDir: "/srv/{{ vdoDev }}"
vdoNfsDir: "{{ vdoMountDir }}/nfs"
vdoLogicalSize: 2T

vdoIndexmode: sparse
vdoWritepolicy: sync
vdoGrowphysical: false
vdoDeduplication: enabled
vdoCompression: enabled
